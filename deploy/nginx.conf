# KAELON ters vekil.
#
# SSE AKIŞI TAMPONLANMAMALIDIR. `/api/ask` yanıtı satır satır akar;
# nginx varsayılan olarak tamponlar ve kullanıcı cevabın tamamını
# sonunda tek seferde görür — canlı akış hissi tamamen kaybolur.

upstream kaelon_app {
    server 127.0.0.1:4310;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name SUNUCU_ADI;

    # Yükleme boyutu: içe aktarma dosyaları büyük olabilir.
    client_max_body_size 25M;

    # Güvenlik başlıkları — uygulama kendi CSP'sini gönderiyor,
    # burada yalnızca taşıma seviyesi olanlar var.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://kaelon_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Model cevabı akarken tamponlama kapalı.
    location /api/ask {
        proxy_pass http://kaelon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # Sağlık kontrolü log'u şişirmesin.
    location /api/health {
        proxy_pass http://kaelon_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
