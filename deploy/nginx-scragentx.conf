# scragentx.com → KAELON
#
# Bu alan adı önce Limra Tech (Revival Rota) statik sitesini sunuyordu;
# 29.08.2026'da KAELON'a devredildi. Eski yapılandırma ve dosyalar
# /var/backups/scragentx-devir-* altında duruyor.
#
# CATCH-ALL (`_`) KORUNDU. Eski blokta vardı; kaldırılsaydı bilinmeyen
# Host başlıklı istekler alfabetik olarak ilk siteye düşer
# ve o site kendi alan adı dışından trafik almaya başlardı.

server {
    listen 80;
    listen [::]:80;
    server_name scragentx.com www.scragentx.com _;

    # Sertifika yenilemesi HTTPS'e yönlendirmeden ÖNCE gelmeli; aksi
    # hâlde certbot doğrulaması yönlendirmeye takılır.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scragentx.com www.scragentx.com _;

    ssl_certificate /etc/letsencrypt/live/scragentx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scragentx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # İçe aktarma dosyaları büyük olabilir.
    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # MODEL CEVABI AKARKEN TAMPONLAMA KAPALI. Açık kalsaydı cevap
    # satır satır değil, sonunda tek seferde görünürdü.
    location /api/ask {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:4310;
        proxy_set_header Host $host;
        access_log off;
    }
}
