<style>
/* ═══════════════ hareket dili ═══════════════
   Üç yay eğrisi. Sayfadaki her hareket bunlardan birini kullanır.
   Damped harmonic oscillator ile hesaplanıp linear() easing'e çevrildi. */

:root{
  --spring-soft: linear(0.0000 0.00%, 0.0118 2.17%, 0.0430 4.35%, 0.0877 6.52%, 0.1415 8.70%, 0.2008 10.87%, 0.2629 13.04%, 0.3257 15.22%, 0.3875 17.39%, 0.4472 19.57%, 0.5041 21.74%, 0.5575 23.91%, 0.6071 26.09%, 0.6529 28.26%, 0.6947 30.43%, 0.7326 32.61%, 0.7668 34.78%, 0.7975 36.96%, 0.8248 39.13%, 0.8491 41.30%, 0.8705 43.48%, 0.8894 45.65%, 0.9058 47.83%, 0.9202 50.00%, 0.9327 52.17%, 0.9435 54.35%, 0.9527 56.52%, 0.9607 58.70%, 0.9675 60.87%, 0.9733 63.04%, 0.9782 65.22%, 0.9823 67.39%, 0.9858 69.57%, 0.9887 71.74%, 0.9911 73.91%, 0.9931 76.09%, 0.9947 78.26%, 0.9960 80.43%, 0.9971 82.61%, 0.9980 84.78%, 0.9987 86.96%, 0.9992 89.13%, 0.9996 91.30%, 0.9999 93.48%, 1.0002 95.65%, 1.0004 97.83%, 1.0000 100.00%);
  --spring: linear(0.0000 0.00%, 0.0191 2.17%, 0.0687 4.35%, 0.1391 6.52%, 0.2222 8.70%, 0.3118 10.87%, 0.4028 13.04%, 0.4917 15.22%, 0.5756 17.39%, 0.6530 19.57%, 0.7226 21.74%, 0.7841 23.91%, 0.8372 26.09%, 0.8824 28.26%, 0.9199 30.43%, 0.9506 32.61%, 0.9749 34.78%, 0.9938 36.96%, 1.0080 39.13%, 1.0182 41.30%, 1.0250 43.48%, 1.0292 45.65%, 1.0312 47.83%, 1.0315 50.00%, 1.0306 52.17%, 1.0288 54.35%, 1.0265 56.52%, 1.0238 58.70%, 1.0210 60.87%, 1.0181 63.04%, 1.0153 65.22%, 1.0127 67.39%, 1.0103 69.57%, 1.0082 71.74%, 1.0063 73.91%, 1.0047 76.09%, 1.0034 78.26%, 1.0022 80.43%, 1.0013 82.61%, 1.0006 84.78%, 1.0001 86.96%, 0.9997 89.13%, 0.9994 91.30%, 0.9992 93.48%, 0.9991 95.65%, 0.9990 97.83%, 1.0000 100.00%);
  --spring-bounce: linear(0.0000 0.00%, 0.0350 2.17%, 0.1257 4.35%, 0.2520 6.52%, 0.3965 8.70%, 0.5450 10.87%, 0.6866 13.04%, 0.8136 15.22%, 0.9211 17.39%, 1.0068 19.57%, 1.0706 21.74%, 1.1136 23.91%, 1.1382 26.09%, 1.1474 28.26%, 1.1445 30.43%, 1.1326 32.61%, 1.1149 34.78%, 1.0939 36.96%, 1.0719 39.13%, 1.0507 41.30%, 1.0314 43.48%, 1.0148 45.65%, 1.0015 47.83%, 0.9914 50.00%, 0.9844 52.17%, 0.9802 54.35%, 0.9784 56.52%, 0.9784 58.70%, 0.9799 60.87%, 0.9824 63.04%, 0.9854 65.22%, 0.9887 67.39%, 0.9918 69.57%, 0.9948 71.74%, 0.9973 73.91%, 0.9994 76.09%, 1.0010 78.26%, 1.0021 80.43%, 1.0028 82.61%, 1.0032 84.78%, 1.0032 86.96%, 1.0030 89.13%, 1.0027 91.30%, 1.0023 93.48%, 1.0018 95.65%, 1.0013 97.83%, 1.0000 100.00%);
  --glide: cubic-bezier(.32,.72,0,1);
  --t-fast:.34s; --t-mid:.62s; --t-slow:.86s;
}

/* ═══════════════ palet ═══════════════ */

:root{
  --bg:#F6F7F9;
  --bg-veil:rgba(246,247,249,.68);
  --surface:#FFFFFF;
  --surface-2:#EFF1F5;
  --surface-3:#E4E8EE;
  --spec:rgba(255,255,255,.9);
  --ink:#0B111A;
  --ink-2:#39424F;
  --muted:#6A7481;
  --faint:#98A1AD;
  --line:#E1E5EB;
  --line-soft:#ECEFF3;
  --accent:#0A7C8C;
  --accent-veil:rgba(10,124,140,.09);
  --accent-glow:rgba(10,124,140,.16);
  --crit:#B23A2E;
  --crit-veil:rgba(178,58,46,.09);
  --warn:#96620A;
  --warn-veil:rgba(150,98,10,.10);
  --ok:#22684C;
  --ok-veil:rgba(34,104,76,.10);
  --aura-a:rgba(10,124,140,.30);
  --aura-b:rgba(120,140,190,.24);
  --sh-s:0 1px 2px rgba(11,17,26,.05), 0 2px 8px -4px rgba(11,17,26,.10);
  --sh-m:0 2px 6px rgba(11,17,26,.05), 0 20px 44px -24px rgba(11,17,26,.30);
  --sh-l:0 4px 14px rgba(11,17,26,.07), 0 44px 96px -44px rgba(11,17,26,.42);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070A0F;
    --bg-veil:rgba(7,10,15,.68);
    --surface:#131A24;
    --surface-2:#1A2230;
    --surface-3:#232C3A;
    --spec:rgba(255,255,255,.07);
    --ink:#ECF1F7;
    --ink-2:#C2CBD7;
    --muted:#8A94A3;
    --faint:#626D7B;
    --line:#222A37;
    --line-soft:#19212C;
    --accent:#45CBDD;
    --accent-veil:rgba(69,203,221,.12);
    --accent-glow:rgba(69,203,221,.22);
    --crit:#E8776A;
    --crit-veil:rgba(232,119,106,.12);
    --warn:#DFA94A;
    --warn-veil:rgba(223,169,74,.13);
    --ok:#5BBF93;
    --ok-veil:rgba(91,191,147,.12);
    --aura-a:rgba(69,203,221,.20);
    --aura-b:rgba(90,110,200,.20);
    --sh-s:0 1px 2px rgba(0,0,0,.5), 0 2px 8px -4px rgba(0,0,0,.5);
    --sh-m:0 2px 6px rgba(0,0,0,.5), 0 20px 44px -24px rgba(0,0,0,.75);
    --sh-l:0 4px 14px rgba(0,0,0,.5), 0 44px 96px -44px rgba(0,0,0,.9);
  }
}

:root[data-theme="dark"]{
  --bg:#070A0F;
  --bg-veil:rgba(7,10,15,.68);
  --surface:#131A24;
  --surface-2:#1A2230;
  --surface-3:#232C3A;
  --spec:rgba(255,255,255,.07);
  --ink:#ECF1F7;
  --ink-2:#C2CBD7;
  --muted:#8A94A3;
  --faint:#626D7B;
  --line:#222A37;
  --line-soft:#19212C;
  --accent:#45CBDD;
  --accent-veil:rgba(69,203,221,.12);
  --accent-glow:rgba(69,203,221,.22);
  --crit:#E8776A;
  --crit-veil:rgba(232,119,106,.12);
  --warn:#DFA94A;
  --warn-veil:rgba(223,169,74,.13);
  --ok:#5BBF93;
  --ok-veil:rgba(91,191,147,.12);
  --aura-a:rgba(69,203,221,.20);
  --aura-b:rgba(90,110,200,.20);
  --sh-s:0 1px 2px rgba(0,0,0,.5), 0 2px 8px -4px rgba(0,0,0,.5);
  --sh-m:0 2px 6px rgba(0,0,0,.5), 0 20px 44px -24px rgba(0,0,0,.75);
  --sh-l:0 4px 14px rgba(0,0,0,.5), 0 44px 96px -44px rgba(0,0,0,.9);
}

/* gün durumu aura rengini değiştirir */
#app[data-day="2"]{ --aura-a:var(--crit-veil); }

*{box-sizing:border-box;}

body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px;}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}

/* ═══════════════ ambient ═══════════════ */

.aura{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.aura i{
  position:absolute;display:block;border-radius:50%;
  filter:blur(90px);will-change:transform;
  transition:background 1.2s var(--glide);
}
.aura i:nth-child(1){
  width:56vw;height:56vw;left:8%;top:-14%;
  background:radial-gradient(circle, var(--aura-a) 0%, transparent 68%);
  animation:drift1 26s ease-in-out infinite alternate;
}
.aura i:nth-child(2){
  width:48vw;height:48vw;right:2%;bottom:-18%;
  background:radial-gradient(circle, var(--aura-b) 0%, transparent 68%);
  animation:drift2 32s ease-in-out infinite alternate;
}
@keyframes drift1{from{transform:translate3d(0,0,0) scale(1);}to{transform:translate3d(9vw,7vh,0) scale(1.14);}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.08);}to{transform:translate3d(-8vw,-6vh,0) scale(.94);}}

/* ═══════════════ kabuk ═══════════════ */

#app{
  position:relative;z-index:1;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  animation:appIn .9s var(--spring-soft) both;
}
@keyframes appIn{from{opacity:0;transform:scale(.988);}to{opacity:1;transform:none;}}

.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:14px 22px;position:relative;z-index:40;
  border-bottom:1px solid transparent;
  transition:border-color var(--t-mid) var(--glide), background var(--t-mid) var(--glide);
}
.chatting .topbar{
  border-bottom-color:var(--line-soft);
  background:var(--bg-veil);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
}

.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:15px;}
.brand .dot{
  width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 0 var(--accent-glow);
  animation:pulse 3.4s var(--glide) infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-glow);}50%{box-shadow:0 0 0 6px transparent;}}

.who{
  font-size:12.5px;color:var(--muted);white-space:nowrap;
  padding-left:16px;border-left:1px solid var(--line);
}
.who b{color:var(--ink-2);font-weight:600;}
.topbar .spacer{flex:1;}
.demo-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:600;white-space:nowrap;}

/* kayan göstergeli segmented control */
.seg{position:relative;display:flex;padding:3px;background:var(--surface-2);border-radius:11px;}
.seg .thumb{
  position:absolute;top:3px;bottom:3px;left:0;width:0;
  background:var(--surface);border-radius:8px;box-shadow:var(--sh-s);
  transition:transform var(--t-mid) var(--spring), width var(--t-mid) var(--spring);
  will-change:transform,width;
}
.seg button{
  position:relative;z-index:1;
  font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:8px;color:var(--muted);
  transition:color var(--t-fast) var(--glide), transform .2s var(--spring-bounce);
}
.seg button[aria-pressed="true"]{color:var(--ink);}
.seg button:hover{color:var(--ink);}
.seg button:active{transform:scale(.94);}

.icon-btn{
  position:relative;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;color:var(--muted);
  transition:background var(--t-fast) var(--glide), color var(--t-fast) var(--glide), transform .24s var(--spring-bounce);
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{position:absolute;width:17px;height:17px;transition:opacity var(--t-mid) var(--glide), transform var(--t-mid) var(--spring);}
.icon-btn .sun{opacity:0;transform:rotate(-70deg) scale(.5);}
.icon-btn .moon{opacity:1;transform:none;}
:root[data-theme="dark"] .icon-btn .sun{opacity:1;transform:none;}
:root[data-theme="dark"] .icon-btn .moon{opacity:0;transform:rotate(70deg) scale(.5);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .icon-btn .sun{opacity:1;transform:none;}
  :root:not([data-theme="light"]) .icon-btn .moon{opacity:0;transform:rotate(70deg) scale(.5);}
}

/* ═══════════════ sahne ═══════════════ */

/* altta kalan görünüm — sheet açılınca bir bütün olarak geri çekilir */
.under{
  height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);transform-origin:top center;
  transition:transform var(--t-slow) var(--spring-soft),
             border-radius var(--t-slow) var(--glide),
             filter var(--t-slow) var(--glide);
}

.scrim{
  position:absolute;inset:0;z-index:25;opacity:0;pointer-events:none;
  transition:opacity var(--t-mid) var(--glide);
}
.sheeted .scrim{opacity:1;pointer-events:auto;}

.body-row{flex:1;display:flex;min-height:0;position:relative;}

.stage{
  flex:1;min-width:0;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 24px 24px;
  transition:padding-right var(--t-slow) var(--spring-soft);
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.stage::-webkit-scrollbar{width:10px;}
.stage::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3.5px solid transparent;background-clip:padding-box;}

.col{width:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;}
.tail{flex:0 0 auto;width:100%;}

/* ═══════════════ hero ═══════════════ */

.hero{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding-bottom:28px;overflow:hidden;
}
.greet-kicker{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:600;}
.greet{
  font-size:clamp(30px,5vw,42px);font-weight:600;letter-spacing:-.036em;
  line-height:1.12;margin:3px 0 0;text-align:center;text-wrap:balance;
}
.greet em{font-style:normal;color:var(--muted);}

/* giriş koreografisi — tek stagger birimi */
.in{animation:blurIn .78s var(--spring-soft) both;}
@keyframes blurIn{
  from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(7px);}
  to{opacity:1;transform:none;filter:blur(0);}
}

/* ═══════════════ sinyaller (Anayasa 3 seviye) ═══════════════ */

.signals{display:flex;flex-direction:column;gap:11px;padding-bottom:20px;}

.sig1{display:flex;align-items:flex-start;gap:11px;font-size:14px;color:var(--muted);padding:1px 4px;}
.sig1 .tick{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:0 0 auto;margin-top:9px;}
.sig1 b{color:var(--ink-2);font-weight:600;}

.sig2{
  position:relative;overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  border-left:3px solid var(--crit);
  border-radius:16px;padding:17px 19px;
  display:flex;flex-direction:column;gap:9px;
  box-shadow:var(--sh-m), inset 0 1px 0 var(--spec);
}
.sig2::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%), var(--crit-veil), transparent 62%);
  opacity:0;transition:opacity .5s var(--glide);
}
.sig2:hover::after{opacity:1;}
.sig2 .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--crit);font-weight:700;}
.sig2 .t{font-size:16.5px;font-weight:600;letter-spacing:-.018em;line-height:1.35;}
.sig2 .d{font-size:13.5px;color:var(--muted);line-height:1.55;}
.sig2 .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}

/* ═══════════════ akış ═══════════════ */

.stream{display:flex;flex-direction:column;gap:28px;padding-bottom:22px;}
.turn{display:flex;flex-direction:column;gap:15px;}

.ask{
  align-self:flex-end;max-width:82%;
  background:var(--surface-2);
  border-radius:19px 19px 6px 19px;
  padding:11px 16px;font-size:15px;line-height:1.5;color:var(--ink);
  box-shadow:inset 0 1px 0 var(--spec);
  animation:askIn .7s var(--spring) both;
  transform-origin:100% 100%;
}
@keyframes askIn{from{opacity:0;transform:translateY(14px) scale(.94);filter:blur(5px);}to{opacity:1;transform:none;filter:blur(0);}}

.reply{display:flex;flex-direction:column;gap:14px;}
.reply .txt{font-size:15.5px;line-height:1.68;color:var(--ink);}
.reply .txt strong{font-weight:600;}

/* kelime kelime beliriş */
.w{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(6px);animation:wordIn .62s var(--spring-soft) both;}
@keyframes wordIn{to{opacity:1;filter:blur(0);transform:none;}}

/* düşünüyor parıltısı */
.think{display:flex;flex-direction:column;gap:9px;animation:blurIn .5s var(--glide) both;}
.think i{
  display:block;height:11px;border-radius:6px;
  background:linear-gradient(100deg, var(--surface-2) 12%, var(--surface-3) 34%, var(--surface-2) 58%);
  background-size:250% 100%;
  animation:sweep 1.5s linear infinite;
}
.think i:nth-child(1){width:88%;}
.think i:nth-child(2){width:64%;animation-delay:.16s;}
@keyframes sweep{from{background-position:180% 0;}to{background-position:-80% 0;}}

.bullets{display:flex;flex-direction:column;gap:10px;margin:2px 0 0;}
.bullet{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.56;animation:blurIn .68s var(--spring-soft) both;}
.bullet .i{
  flex:0 0 auto;width:20px;height:20px;border-radius:7px;margin-top:2px;
  display:grid;place-items:center;font-size:10.5px;font-weight:700;
  background:var(--accent-veil);color:var(--accent);font-variant-numeric:tabular-nums;
}
.bullet.c .i{background:var(--crit-veil);color:var(--crit);}
.bullet.w .i{background:var(--warn-veil);color:var(--warn);}
.bullet .b{color:var(--ink-2);}
.bullet .b b{color:var(--ink);font-weight:600;}

.source{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px 12px;
  font-size:11.5px;color:var(--faint);
  padding-top:11px;border-top:1px solid var(--line-soft);
  animation:blurIn .6s var(--glide) both;
}
.source .k{font-family:"IBM Plex Mono",monospace;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--ok-veil);color:var(--ok);}
.pill.w{background:var(--warn-veil);color:var(--warn);}

.acts{display:flex;flex-wrap:wrap;gap:8px;animation:blurIn .66s var(--spring-soft) both;}

.act{
  font-size:13px;font-weight:600;letter-spacing:-.005em;
  padding:9px 15px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  box-shadow:var(--sh-s), inset 0 1px 0 var(--spec);
  transition:transform var(--t-fast) var(--spring), box-shadow var(--t-fast) var(--glide),
             color .2s var(--glide), background .2s var(--glide);
}
.act:hover{transform:translateY(-2px);box-shadow:var(--sh-m), inset 0 1px 0 var(--spec);color:var(--ink);}
.act:active{transform:translateY(0) scale(.96);transition-duration:.1s;}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.act.primary:hover{color:var(--bg);}
.act.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted);}
.act.ghost:hover{background:var(--surface-2);color:var(--ink);}

/* ═══════════════ composer ═══════════════ */

.dock{position:relative;z-index:5;}

.composer{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:10px 10px 10px 19px;
  box-shadow:var(--sh-m), inset 0 1px 0 var(--spec);
  transition:box-shadow var(--t-mid) var(--glide), border-color var(--t-fast) var(--glide), transform var(--t-mid) var(--spring);
}
.composer:focus-within{
  border-color:color-mix(in srgb, var(--accent) 42%, var(--line));
  box-shadow:var(--sh-l), inset 0 1px 0 var(--spec), 0 0 0 4px var(--accent-veil);
}
.composer textarea{
  flex:1;background:none;border:none;resize:none;outline:none;
  font:inherit;font-size:15.5px;line-height:1.5;color:var(--ink);
  max-height:150px;padding:6px 0;
}
.composer textarea::placeholder{color:var(--faint);}

.send{
  flex:0 0 auto;width:37px;height:37px;border-radius:13px;
  display:grid;place-items:center;background:var(--ink);color:var(--bg);
  opacity:.24;pointer-events:none;transform:scale(.86);
  transition:opacity var(--t-fast) var(--glide), transform var(--t-mid) var(--spring-bounce);
}
.send.on{opacity:1;pointer-events:auto;transform:scale(1);}
.send:hover{transform:scale(1.08);}
.send:active{transform:scale(.9);transition-duration:.1s;}
.send svg{width:16px;height:16px;}


.hide{display:none !important;}

/* ═══════════════ panel çekmecesi ═══════════════ */

.drawer{
  position:absolute;top:var(--topbar,0px);right:0;bottom:0;width:428px;
  background:var(--bg-veil);
  -webkit-backdrop-filter:saturate(180%) blur(26px);
  backdrop-filter:saturate(180%) blur(26px);
  border-left:1px solid var(--line);
  transform:translate3d(100%,0,0);
  transition:transform var(--t-slow) var(--spring-soft);
  display:flex;flex-direction:column;z-index:30;
  will-change:transform;
}
.drawer.open{transform:translate3d(0,0,0);}
.stage.shifted{padding-right:452px;}

.drawer-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-soft);}
.drawer-head .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:1;}
.drawer-body{
  flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 18px 28px;
  display:flex;flex-direction:column;gap:14px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.drawer-body::-webkit-scrollbar{width:10px;}
.drawer-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3.5px solid transparent;background-clip:padding-box;}

.panel{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--sh-s), inset 0 1px 0 var(--spec);
  animation:panelIn .82s var(--spring) both;
  transform-origin:100% 20%;
}
@keyframes panelIn{from{opacity:0;transform:translateX(26px) scale(.94);filter:blur(6px);}to{opacity:1;transform:none;filter:blur(0);}}
.panel.leaving{animation:panelOut .42s var(--glide) both;}
@keyframes panelOut{to{opacity:0;transform:translateX(26px) scale(.95);filter:blur(6px);}}
.panel::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%), var(--accent-veil), transparent 60%);
  opacity:0;transition:opacity .5s var(--glide);
}
.panel:hover::after{opacity:1;}

.panel-head{display:flex;align-items:center;gap:10px;padding:15px 16px 13px;border-bottom:1px solid var(--line-soft);position:relative;z-index:1;}
.panel-head h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.018em;flex:1;}
.panel-head .when{font-size:11px;color:var(--faint);font-family:"IBM Plex Mono",monospace;}
.panel-x{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;color:var(--faint);transition:background .2s var(--glide),color .2s var(--glide),transform .2s var(--spring-bounce);}
.panel-x:hover{background:var(--surface-2);color:var(--ink);}
.panel-x:active{transform:scale(.88);}
.panel-x svg{width:13px;height:13px;}

.panel-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:13px;position:relative;z-index:1;}
.panel-body p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6;}

.rrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);animation:blurIn .66s var(--spring-soft) both;}
.rrow:last-child{border-bottom:none;}
.rdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.rdot.r{background:var(--crit);box-shadow:0 0 0 3px var(--crit-veil);}
.rdot.y{background:var(--warn);box-shadow:0 0 0 3px var(--warn-veil);}
.rdot.g{background:var(--ok);box-shadow:0 0 0 3px var(--ok-veil);}
.rmain{flex:1;min-width:0;}
.rmain .n{font-size:13.5px;font-weight:600;letter-spacing:-.012em;}
.rmain .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.rval{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.rval.r{color:var(--crit);}.rval.y{color:var(--warn);}.rval.g{color:var(--ok);}

.st{display:flex;flex-direction:column;gap:6px;}
.st-top{display:flex;align-items:baseline;gap:8px;font-size:13px;}
.st-top .n{font-weight:600;flex:1;letter-spacing:-.012em;}
.st-top .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;}
.bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent);width:0;transition:width 1.1s var(--spring-soft);}
.bar i.r{background:var(--crit);}.bar i.y{background:var(--warn);}
.st-note{font-size:11.5px;color:var(--faint);}

.kv{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
.kv:last-of-type{border-bottom:none;}
.kv span{color:var(--muted);}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;}
.checks{display:flex;flex-direction:column;gap:7px;padding:13px 15px;background:var(--warn-veil);border-radius:13px;}
.checks .h{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);}
.checks ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:5px;}
.checks li{font-size:12.5px;color:var(--ink-2);line-height:1.5;}

.limit{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.55;background:var(--surface-2);border-radius:13px;padding:12px 14px;}
.limit .l4{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 6px;border-radius:5px;background:var(--crit-veil);color:var(--crit);margin-top:1px;}

.panel-acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:3px;}

/* ═══════════════ toast ═══════════════ */

.toast{
  position:fixed;left:50%;top:16px;
  transform:translate3d(-50%,-180%,0) scale(.94);
  background:var(--ink);color:var(--bg);
  border-radius:15px;padding:13px 19px;
  font-size:13.5px;font-weight:500;line-height:1.5;
  box-shadow:var(--sh-l);
  max-width:min(540px, calc(100vw - 36px));
  opacity:0;pointer-events:none;z-index:60;filter:blur(6px);
  transition:transform var(--t-slow) var(--spring), opacity var(--t-fast) var(--glide), filter var(--t-mid) var(--glide);
}
.toast.show{transform:translate3d(-50%,0,0) scale(1);opacity:1;filter:blur(0);}

/* ═══════════════ dar ekran — iOS sheet ═══════════════ */

@media (max-width:880px){
  .who,.demo-label{display:none;}
  .topbar{padding:12px 16px;gap:12px;}
  .stage{padding:0 16px 20px;}
  .stage.shifted{padding-right:16px;}
  .drawer{
    width:100%;left:0;top:auto;height:80dvh;
    border-left:none;border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;
    transform:translate3d(0,100%,0);
    box-shadow:var(--sh-l);
  }
  .drawer.open{transform:translate3d(0,0,0);}
  /* altta kalan görünüm geri çekilir — iOS sheet sunumu */
  .sheeted .under{transform:scale(.93) translateY(-10px);border-radius:18px;filter:brightness(.8);}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  .aura{display:none;}
}

  ];

  const FALLBACK = {
    text:"Bu soruyu bu prototipte cevaplayamıyorum. Elimdeki sahte veri üretim, sevkiyat, kalite, nakit, fatura, KDV ve mesai konularını kapsıyor — bunlardan birini sorabilirsiniz. Gerçek üründe soru intent + entity çözümlemesinden geçer, yetkiniz kontrol edilir ve onaylı sorgu şablonuyla cevaplanır.",
    bullets:[], src:"Prototip · sahte veri", sync:"—", acts:[]
  };

  function match(q){
    const s = q.toLocaleLowerCase("tr");
    let best=null, score=0;
    KB.forEach(e => { let n=0; e.k.forEach(k => { if(s.includes(k)) n+=k.length; }); if(n>score){score=n;best=e;} });
    return best || FALLBACK;
  }

  /* ── kelime kelime beliriş ── */
  function splitWords(root, startDelay){
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    let i=0;
    nodes.forEach(t => {
      const frag=document.createDocumentFragment();
      t.nodeValue.split(/(\s+)/).forEach(part => {
        if(!part) return;
        if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return; }
        const s=el("span","w"); s.textContent=part;
        s.style.animationDelay = (startDelay + i*0.017).toFixed(3)+"s"; i++;
        frag.appendChild(s);
      });
      t.parentNode.replaceChild(frag, t);
    });
    return i;
  }

  /* ── konuşmaya geçiş: FLIP ── */
  function enterChat(){
    if(chatting) return;
    chatting = true;

    const first = dock.getBoundingClientRect();
    const heroH = hero.offsetHeight;

    app.classList.add("chatting");
    signals.classList.add("hide");
    tail.style.height = "0px";

    if(reduce){ hero.style.display="none"; return; }

    hero.animate(
      [{height:heroH+"px",opacity:1,transform:"none",filter:"blur(0px)"},
       {height:"0px",opacity:0,transform:"translateY(-18px) scale(.96)",filter:"blur(8px)"}],
      {duration:520, easing:"cubic-bezier(.32,.72,0,1)", fill:"forwards"}
    ).onfinish = () => { hero.style.display="none"; };

    const last = dock.getBoundingClientRect();
    const dy = first.top - last.top;
    if(Math.abs(dy) > 1){
      dock.animate([{transform:"translateY("+dy+"px)"},{transform:"translateY(0)"}],
        {duration:760, easing:SPRING_SOFT});
    }
  }

  function reset(){
    chatting = false;
    app.classList.remove("chatting");
    signals.classList.remove("hide");
    hero.style.display="";
    hero.getAnimations().forEach(a => a.cancel());
    hero.style.height=""; hero.style.opacity=""; hero.style.transform=""; hero.style.filter="";
    stream.innerHTML="";
    closeDrawer();
    renderSignals();
  }

  /* ── soru → cevap ── */
  let busy=false;

  function ask(q){
    if(busy || !q.trim()) return;
    busy = true;
    enterChat();
    input.value=""; autosize(); toggleSend();

    const turn = el("div","turn");
    turn.appendChild(el("div","ask", escapeHtml(q)));
    stream.appendChild(turn);
    scrollDown();

    const think = el("div","think","<i></i><i></i>");
    turn.appendChild(think);
    scrollDown();

    const a = match(q);
    const wait = reduce ? 30 : 760;

    setTimeout(() => {
      think.remove();

      const reply = el("div","reply");
      const txt = el("div","txt", a.text);
      reply.appendChild(txt);
      turn.appendChild(reply);

      const count = reduce ? 0 : splitWords(txt, 0);
      const after = reduce ? 0 : count*0.017 + 0.18;

      if(a.bullets && a.bullets.length){
        const wrap = el("div","bullets");
        a.bullets.forEach((b,i) => {
          const row = el("div","bullet"+(b.t?" "+b.t:""),
            '<span class="i">'+b.i+'</span><span class="b"><b>'+b.h+'</b>'+(b.b?" "+b.b:"")+'</span>');
          row.style.animationDelay = (after + i*0.075)+"s";
          wrap.appendChild(row);
        });
        reply.appendChild(wrap);
      }

      const src = el("div","source");
      src.style.animationDelay = (after + (a.bullets?a.bullets.length*0.075:0) + 0.08)+"s";
      if(a.pill) src.appendChild(el("span","pill"+(a.pillW?" w":""), a.pill));
      src.appendChild(el("span","k","Kaynak: "+a.src));
      src.appendChild(el("span","k","Son senkronizasyon: "+a.sync));
      reply.appendChild(src);

      if(a.acts && a.acts.length){
        const acts = el("div","acts");
        acts.style.animationDelay = (after + (a.bullets?a.bullets.length*0.075:0) + 0.16)+"s";
        a.acts.forEach((x,i) => {
          const b = el("button","act"+(i===0 && x.p?" primary":""), x.l);
          if(x.p) b.dataset.panel=x.p;
          if(x.ask) b.dataset.ask=x.ask;
          if(x.toast) b.dataset.toast=x.toast;
          acts.appendChild(b);
        });
        reply.appendChild(acts);
      }

      requestAnimationFrame(scrollDown);
      setTimeout(scrollDown, 260);
      busy = false;
    }, wait);
  }

  function scrollDown(){
    stage.scrollTo({top:stage.scrollHeight, behavior: reduce ? "auto" : "smooth"});
  }
  function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  /* ── paneller ── */
  const PANELS = {
    sevkiyat:{ title:"Sevkiyat Riski · Hafta 19", when:"07:38",
      body:`<p>18 sipariş bu hafta sevk edilecek. Tarihler taahhüt değil, <strong>gerçek üretim akışından hesaplandı.</strong></p>
      <div>
        <div class="rrow"><i class="rdot r"></i><div class="rmain"><div class="n">Volvo SO-2026-0418</div><div class="s">Taahhüt 12.05 · tahmini 16.05</div></div><div class="rval r">+4 gün</div></div>
        <div class="rrow"><i class="rdot r"></i><div class="rmain"><div class="n">Daimler SO-2026-0427</div><div class="s">Taahhüt 13.05 · tahmini 18.05</div></div><div class="rval r">+5 gün</div></div>
        <div class="rrow"><i class="rdot r"></i><div class="rmain"><div class="n">MAN SO-2026-0431</div><div class="s">Taahhüt 14.05 · tahmini 17.05</div></div><div class="rval r">+3 gün</div></div>
        <div class="rrow"><i class="rdot y"></i><div class="rmain"><div class="n">4 sipariş</div><div class="s">1–2 gün gecikme tahmini</div></div><div class="rval y">sarı</div></div>
        <div class="rrow"><i class="rdot g"></i><div class="rmain"><div class="n">11 sipariş</div><div class="s">Taahhüde uyuyor</div></div><div class="rval g">yeşil</div></div>
      </div>
      <div class="checks"><span class="h">Yapılabilecek müdahale</span><ul>
        <li>Boya hattı 2'ye 8 birim kaydır → Volvo gecikmesi 2 güne iner</li>
        <li>Daimler için kalite hold release önceliği aç → 1 gün</li>
        <li>MAN için fazla mesai onayı → 1 gün</li></ul></div>
      <p style="color:var(--crit);font-weight:600">Toplam ceza riski: ~<b data-count="156000" data-suffix=" TL">0 TL</b> (sözleşme %0,5/gün)</p>`,
      acts:[{l:"Boya kaydırmasını onaya gönder",primary:true,toast:"Üretim Müdürü onayına gönderildi. Plan değişikliği onaylanmadan uygulanmaz."},
            {l:"Müşterileri bilgilendir",toast:"3 bilgilendirme taslağı hazırlandı. Gönderim CFO onayı sonrası — KAELON kendiliğinden göndermez."}] },

    fabrika:{ title:"Fabrika Canlı", when:"anlık",
      body:`<p>142 aktif iş emri · 87/94 personel vardiyada · 31/38 makine çalışıyor.</p>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="st"><div class="st-top"><span class="n">Kesim</span><span class="v">%89</span></div><div class="bar"><i data-w="89" class="y"></i></div><div class="st-note">Kapasitenin sınırına yakın</div></div>
        <div class="st"><div class="st-top"><span class="n">Kaynak</span><span class="v">%64</span></div><div class="bar"><i data-w="64"></i></div><div class="st-note">4 iş emri kalite hold nedeniyle bekliyor</div></div>
        <div class="st"><div class="st-top"><span class="n">Boya</span><span class="v">%96</span></div><div class="bar"><i data-w="96" class="r"></i></div><div class="st-note">Darboğaz — sıradaki 6 iş emri bekliyor</div></div>
        <div class="st"><div class="st-top"><span class="n">Montaj</span><span class="v">%41</span></div><div class="bar"><i data-w="41"></i></div><div class="st-note">Boya çıkışı bekleniyor, boş çalışıyor</div></div>
      </div>
      <div class="kv"><span>Gerçek hız (son 4 sa)</span><b><b data-count="29" data-suffix=" br/sa">0</b></b></div>
      <div class="kv"><span>Hedef hız</span><b>38 br/sa</b></div>
      <div class="kv"><span>Bugünkü tahmini çıktı</span><b>218 / 280</b></div>`,
      acts:[{l:"Boya darboğazını incele",toast:"Kök neden analizi: son 30 günde boya hattı 7 kez darboğaz oldu. Detay panel gerçek üründe açılır."}] },

    kdv:{ title:"Nisan 2026 KDV · Onay Kartı", when:"06:15",
      body:`<div class="kv"><span>Hesaplanan KDV</span><b data-count="3034500" data-suffix=" TL">0</b></div>
      <div class="kv"><span>İndirilecek KDV</span><b data-count="2011000" data-suffix=" TL">0</b></div>
      <div class="kv"><span>Önceki dönem devreden</span><b data-count="380000" data-suffix=" TL">0</b></div>
      <div class="kv"><span>Ödenecek KDV taslağı</span><b data-count="643500" data-suffix=" TL" style="color:var(--accent)">0</b></div>
      <div class="checks"><span class="h">Kontrol notları · 5</span><ul>
        <li>3 gelen fatura hâlâ onay bekliyor</li>
        <li>2 faturada KDV oranı uyumsuzluğu</li>
        <li>1 tevkifat kodu eksik</li>
        <li>1 ihracat faturasında destekleyici belge eksik</li>
        <li>Devreden KDV muhasebe müdürü onayı gerektiriyor</li></ul></div>
      <div class="limit"><span class="l4">L4</span><span>Resmî beyanname gönderimini KAELON <strong>hiçbir koşulda</strong> yapmaz. Onayınız taslağı muhasebe müdürüne iletir; GİB'e gönderim yetkili insan ve entegratör üzerinden yürür.</span></div>`,
      acts:[{l:"Onayla ve muhasebe müdürüne gönder",primary:true,toast:"Onaylandı. Taslak muhasebe müdürüne iletildi. Resmî gönderim yetkili insan + entegratör tarafından yapılır — KAELON göndermez."},
            {l:"Düzeltme iste",toast:"Taslak \"düzeltme bekliyor\" durumuna alındı. Kontrol notları sorumlulara görev olarak açıldı."}] }
  };

  const isNarrow = () => matchMedia("(max-width:880px)").matches;

  function openPanel(key){
    const p = PANELS[key];
    if(!p) return;

    const has = drawerBody.querySelector('[data-key="'+key+'"]');
    drawer.classList.add("open");
    stage.classList.add("shifted");
    if(isNarrow()) app.classList.add("sheeted");

    if(has){ has.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}); return; }

    const node = el("article","panel");
    node.dataset.key = key;
    node.innerHTML =
      '<div class="panel-head"><h3>'+p.title+'</h3><span class="when">'+p.when+'</span>'+
      '<button class="panel-x" data-close="1" aria-label="Paneli kapat">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
      '<div class="panel-body">'+p.body+
      (p.acts && p.acts.length ? '<div class="panel-acts" style="animation:none">'+p.acts.map(a =>
        '<button class="act'+(a.primary?" primary":"")+'" data-toast="'+escapeHtml(a.toast)+'">'+a.l+'</button>').join("")+'</div>' : "")+
      '</div>';

    drawerBody.prepend(node);

    node.querySelectorAll(".rrow").forEach((r,i) => { r.style.animationDelay = (0.18 + i*0.06)+"s"; });

    setTimeout(() => {
      node.querySelectorAll(".bar i").forEach((b,i) => {
        setTimeout(() => { b.style.width = b.dataset.w+"%"; }, i*90);
      });
      node.querySelectorAll("[data-count]").forEach((n,i) => setTimeout(() => countUp(n), i*80));
    }, reduce ? 0 : 220);
  }

  function countUp(node){
    const target = +node.dataset.count, suffix = node.dataset.suffix || "";
    if(reduce){ node.textContent = target.toLocaleString("tr-TR")+suffix; return; }
    const dur = 900, t0 = performance.now();
    (function step(now){
      const p = Math.min(1,(now-t0)/dur);
      const e = 1 - Math.pow(1-p, 3);
      node.textContent = Math.round(target*e).toLocaleString("tr-TR")+suffix;
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }

  function closeDrawer(){
    drawer.classList.remove("open");
    stage.classList.remove("shifted");
    app.classList.remove("sheeted");
    setTimeout(() => { if(!drawer.classList.contains("open")) drawerBody.innerHTML=""; }, 900);
  }
  $("#drawerClose").addEventListener("click", closeDrawer);
  scrim.addEventListener("click", closeDrawer);

  /* ── toast ── */
  let toastTimer;
  function toast(msg){
    const t=$("#toast");
    t.textContent=msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove("show"), 5400);
  }

  /* ── imleç takipli parlama ── */
  document.addEventListener("pointermove", e => {
    const c = e.target.closest && e.target.closest(".panel, .sig2");
    if(!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", ((e.clientX-r.left)/r.width*100)+"%");
    c.style.setProperty("--my", ((e.clientY-r.top)/r.height*100)+"%");
  }, {passive:true});

  /* ── olay yönlendirme ── */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-panel],[data-ask],[data-toast],[data-close],[data-q]");
    if(!t) return;
    if(t.dataset.close){
      const n = t.closest(".panel");
      n.classList.add("leaving");
      setTimeout(() => { n.remove(); if(!drawerBody.children.length) closeDrawer(); }, 420);
      return;
    }
    if(t.dataset.panel) openPanel(t.dataset.panel);
    if(t.dataset.ask)   ask(t.dataset.ask);
    if(t.dataset.q)     ask(t.dataset.q);
    if(t.dataset.toast) toast(t.dataset.toast);
  });

  /* ── composer ── */
  function autosize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,150)+"px"; }
  function toggleSend(){ send.classList.toggle("on", input.value.trim().length>0); }
  input.addEventListener("input", () => { autosize(); toggleSend(); if(!chatting) centerTail(false); });
  input.addEventListener("keydown", e => {
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(input.value); }
    if(e.key==="Escape" && drawer.classList.contains("open")) closeDrawer();
  });
  send.addEventListener("click", () => ask(input.value));

  function measureChrome(){
    document.documentElement.style.setProperty("--topbar", $(".topbar").offsetHeight+"px");
  }
  addEventListener("resize", () => { measureChrome(); moveThumb(); centerTail(false); });

  /* ── başlat ── */
  renderSignals();
  measureChrome();
  requestAnimationFrame(() => { measureChrome(); moveThumb(); centerTail(false); });
  setTimeout(() => { centerTail(false); input.focus(); }, 900);
})();
</script>
